<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IDELUX AI Experience</title><style>*{box-sizing:border-box}body{margin:0;background:#061924;color:#eff;font-family:Arial,sans-serif;text-align:center}.app{max-width:550px;min-height:100dvh;margin:auto;padding:5vh 22px;background:radial-gradient(ellipse at 50% 30%,#154d56,#061924 60%)}header{font-weight:bold;letter-spacing:3px;color:#75e8d6}h1{font-size:clamp(30px,7vw,46px);margin-top:8vh}.orb{margin:7vh auto;border-radius:100%;height:190px;width:190px;background:radial-gradient(circle at 35% 28%,#e4fffa,#54ead6 30%,#147da4 64%,#112d6a);box-shadow:0 0 60px #27e8be66}.live{animation:pulse 1.8s infinite alternate}@keyframes pulse{to{transform:scale(1.09);box-shadow:0 0 90px #24fad1}}p{color:#aed2d8;line-height:1.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:0;border-radius:15px;padding:18px;color:white;background:#174454;font-weight:700;font-size:15px;cursor:pointer}.primary{width:100%;margin-top:18px;background:#21b5a4;color:#002f35;font-size:19px}.overlay{display:none;position:fixed;inset:0;background:#061924;overflow:auto;padding:22px}.visible{display:block}.inner{max-width:550px;margin:auto}video,img{width:100%;max-height:52vh;object-fit:cover;border-radius:16px;background:#182b37}input{width:100%;padding:16px;font-size:16px;margin:12px 0;background:#173846;color:white;border:1px solid #3b727a;border-radius:12px}.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.row button{flex:1}small{color:#9acbd1}</style></head><body><main class="app"><header>◇ IDELUX AI EXPERIENCE</header><h1>Imagina algo.<br>Vamos a crearlo.</h1><p id="status">Soy Luxi. ¡Hablemos y creemos un recuerdo increíble!</p><div id="orb" class="orb"></div><div class="grid"><button onclick="openCamera('')">📸 Tomar foto</button><button onclick="openCamera('Agrégame un sombrero de vaquero')">🤠 Vaquero</button><button onclick="openCamera('Vísteme de astronauta')">🚀 Astronauta</button><button onclick="openCamera('Transforma mi foto en un escenario cinematográfico sorprendente')">✨ Sorpréndeme</button></div><button class="primary" id="speak" onclick="startVoice()">🎙️ HABLAR CON LUXI</button><p><small>Autoriza cámara y micrófono para usar la experiencia.</small></p></main><section id="overlay" class="overlay"><div class="inner"><h2>📸 Tu foto con IA</h2><video id="video" autoplay muted playsinline></video><img id="img" style="display:none"><p id="photoStatus">Mira a la cámara</p><input id="prompt" placeholder="¿Qué quieres agregar o cambiar?"><div class="row"><button onclick="capture()">📷 Tomar foto</button><button onclick="editPhoto()">✨ Crear con IA</button><button onclick="savePhoto()">↓ Guardar</button><button onclick="closeCamera()">Cerrar</button></div></div></section><script>
let pc,dc,mic,cam,photo;const $=id=>document.getElementById(id);function send(e){if(dc?.readyState==='open')dc.send(JSON.stringify(e))}function ask(text){send({type:'conversation.item.create',item:{type:'message',role:'user',content:[{type:'input_text',text}]}});send({type:'response.create'})}async function startVoice(){if(pc){pc.close();mic?.getTracks().forEach(x=>x.stop());pc=null;$('speak').textContent='🎙️ HABLAR CON LUXI';$('orb').classList.remove('live');return}try{mic=await navigator.mediaDevices.getUserMedia({audio:true});pc=new RTCPeerConnection();const audio=new Audio();audio.autoplay=true;pc.ontrack=e=>audio.srcObject=e.streams[0];mic.getTracks().forEach(t=>pc.addTrack(t,mic));dc=pc.createDataChannel('oai-events');dc.onopen=()=>{$('status').textContent='Te escucho. Cuéntame qué imaginas.';$('orb').classList.add('live');$('speak').textContent='⏹️ TERMINAR';ask('Saluda brevemente y ofrece conversar o crear una foto divertida.')};dc.onmessage=async e=>{const d=JSON.parse(e.data);if(d.type==='response.output_audio_transcript.done')$('status').textContent=d.transcript;if(d.type==='response.function_call_arguments.done'&&d.name==='preparar_foto'){const p=JSON.parse(d.arguments).prompt||'';await openCamera(p);send({type:'conversation.item.create',item:{type:'function_call_output',call_id:d.call_id,output:'Cámara abierta. El visitante debe confirmar la captura.'}});send({type:'response.create'})}if(d.type==='error')$('status').textContent=d.error?.message||'Error de voz'};const offer=await pc.createOffer();await pc.setLocalDescription(offer);const r=await fetch('/api/session',{method:'POST',headers:{'Content-Type':'application/sdp'},body:offer.sdp});if(!r.ok){const d=await r.json();throw Error(d.error||'Error '+r.status)}await pc.setRemoteDescription({type:'answer',sdp:await r.text()})}catch(e){$('status').textContent='Error: '+e.message;pc?.close();pc=null}}
async function openCamera(prompt){$('overlay').classList.add('visible');$('prompt').value=prompt||'';$('img').style.display='none';$('video').style.display='block';try{cam?.getTracks().forEach(x=>x.stop());cam=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});$('video').srcObject=cam}catch(e){$('photoStatus').textContent=e.message}}function capture(){const v=$('video');if(!v.videoWidth)return;const c=document.createElement('canvas');c.width=768;c.height=1024;const x=c.getContext('2d');x.translate(768,0);x.scale(-1,1);x.drawImage(v,0,0,768,1024);photo=c.toDataURL('image/jpeg',.84);$('img').src=photo;$('img').style.display='block';$('video').style.display='none';cam?.getTracks().forEach(t=>t.stop());$('photoStatus').textContent='Foto tomada. Presiona Crear con IA.'}
async function editPhoto(){if(!photo)return $('photoStatus').textContent='Primero toma una foto';$('photoStatus').textContent='✨ Generando imagen con IA...';try{const r=await fetch('/api/edit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:photo,prompt:$('prompt').value})});const d=await r.json();if(!r.ok)throw Error(d.error);$('img').src=d.image;$('photoStatus').textContent='¡Tu recuerdo está listo!';ask('La edición de foto está lista. Felicita brevemente al participante.')}catch(e){$('photoStatus').textContent='Error: '+e.message}}
function savePhoto(){if(!$('img').src)return;const a=document.createElement('a');a.href=$('img').src;a.download='idelux-ai-recuerdo.png';a.click()}function closeCamera(){cam?.getTracks().forEach(t=>t.stop());$('overlay').classList.remove('visible')}
</script></body></html>
