<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IDELUX · Proyección de fotos</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#020b16;overflow:hidden;font-family:Arial,sans-serif;color:#e8ffff}body{background:radial-gradient(circle at 50% 50%,#133743,#020b16 67%)}.wrap{height:100vh;width:100vw;display:grid;place-items:center;padding:3vh 3vw}#photo{display:none;max-width:96vw;max-height:94vh;width:auto;height:auto;object-fit:contain;border-radius:12px;box-shadow:0 15px 70px #0009;animation:fade .6s ease}#intro{text-align:center;opacity:.85}h1{letter-spacing:.13em}#status{font-size:14px;color:#9fd7d3}#enter{padding:13px 20px;border-radius:12px;background:#1bbba8;color:#061d24;border:0;font-weight:700;cursor:pointer}#fullscreen{position:fixed;right:20px;bottom:18px;background:#123746c9;color:#fff;border:1px solid #4b8792;padding:10px 15px;border-radius:10px;cursor:pointer;z-index:5}@keyframes fade{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}@media(prefers-reduced-motion:reduce){#photo{animation:none}}</style></head><body><button id="fullscreen" onclick="document.documentElement.requestFullscreen?.()">⛶ Pantalla completa</button><div class="wrap"><div id="intro"><h1>◇ IDELUX</h1><p id="status">Esperando fotografías…</p></div><img id="photo" alt="Fotografía del evento"></div><script>
const ch=new URLSearchParams(location.search).get('channel'),img=document.getElementById('photo'),intro=document.getElementById('intro'),status=document.getElementById('status');let photos=[],idx=-1;const pause=20000;function next(){if(!photos.length)return;idx=(idx+1)%photos.length;img.style.animation='none';img.offsetWidth;img.style.animation='';img.src=photos[idx].url;img.style.display='block';intro.style.display='none'}async function update(){if(!/^[a-f0-9]{32}$/.test(ch||'')){status.textContent='Enlace de pantalla inválido';return}try{const r=await fetch('/api/projection?channel='+encodeURIComponent(ch)+'&ts='+Date.now(),{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'No disponible');let old=photos.map(p=>p.url).join('|');photos=d.photos||[];let neu=photos.map(p=>p.url).join('|');if(!photos.length){status.textContent='Esperando fotografías del evento…'}else if(neu!==old){idx=photos.length-2;next()}}catch(e){status.textContent='Conexión: '+e.message}}update();setInterval(update,3500);setInterval(()=>{if(photos.length>1)next()},pause);
</script></body></html>
